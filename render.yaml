# Render Blueprint: deploys the app as one long-running Node server with https.
# One server process on purpose: grants and keys live in server memory, so serverless hosting would break the demo.
services:
  - type: web
    name: datadeck
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOW_DEMO_RESET
        value: "1"
      - key: GRANT_BACKEND
        value: mock
      - key: NEXT_PUBLIC_GRANT_BACKEND
        value: mock
      - key: PAYOUT_MODE
        value: simulate
      # Optional, for the AI summary. Render asks for it on first deploy; leave it empty to skip.
      - key: ANTHROPIC_API_KEY
        sync: false
